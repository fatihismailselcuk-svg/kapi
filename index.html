8px;padding:12px 14px;border-bottom:1px solid var(--edge)}.tabs button{font-size:12px}.data{padding:12px;overflow:auto;flex:1;min-height:0}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.item{padding:10px;border:1px solid var(--edge);border-radius:8px;overflow-wrap:anywhere}.item small{display:block;color:var(--sub);margin-bottom:5px}.item b{font-variant-numeric:tabular-nums;font-size:14px}.sectionhead{font-weight:750;margin:4px 0 10px;font-size:14px}.sat-panel{border-top:1px solid var(--edge);margin-top:16px;padding-top:14px}.satgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.value-missing{color:var(--sub)}.raw{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d6e5fd;font-size:12px;line-height:1.55}.hidden{display:none!important}.footer{padding:10px 14px;font-size:12px;color:var(--sub);border-top:1px solid var(--edge)}a{color:#90d8ff}@media(max-width:800px){main{height:auto;grid-template-columns:1fr}.mapwrap{height:48dvh;flex:initial}.right{height:65dvh}.form{grid-template-columns:1fr 1fr}}

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js" crossorigin="anonymous"></script><script>
'use strict';
const $=x=>document.getElementById(x), text=(x,v)=>{$(x).textContent=v};

let pollTimer=null, sessionTimer=null, countdownTimer=null, sessionEndsAt=0, rapidEndsAt=0, rapidNextAllowedAt=0, rapidActive=false;
const timeLeft=ms=>{const sec=Math.max(0,Math.ceil(ms/1000));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};

function saveRapidCooldown(t){rapidNextAllowedAt=t;try{localStorage.setItem(FAST_COOLDOWN_KEY,String(t))}catch{ /* Depolama engellenirse bekleme bu sekmede korunur. */ }}
const sessionExpired=()=>sessionEndsAt>0&&Date.now()>=sessionEndsAt;
const loggedIn=()=>!!client?.connected&&!$('app').classList.contains('hidden');
const HOST='mfc1e7d3.ala.us-east-1.emqxsl.com', USERNAME='kapi_aile', PREFIX='kapi/status';const randomId=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');
const TURKEY=[35.0,39.0]; // MapLibre: [boylam, enlem]
function circlePolygon(center,radius){
  const [lon,lat]=center, pts=[]; const R=6378137;
  for(let i=0;i<=64;i++){
    const a=2*Math.PI*i/64;
    const dLat=(radius*Math.cos(a)/R)*180/Math.PI;
    const dLon=(radius*Math.sin(a)/(R*Math.max(0.01,Math.cos(lat*Math.PI/180))))*180/Math.PI;

  }
  return {type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Polygon',coordinates:[pts]},properties:{}}]};
}
const noAccuracy={type:'FeatureCollection',features:[]};
function updateAccuracy(){
  if(!map||!mapLoaded)return;
  const src=map.getSource('gpsAccuracy');
  if(src)src.setData(lastPosition&&lastAccuracy?circlePolygon(lastPosition,lastAccuracy):noAccuracy);
}
function initVisibleMap(){
  if($('app').classList.contains('hidden'))return;
  if(!window.maplibregl){text('mapinfo','Harita kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.');return;}
  if(!map){
    map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:TURKEY,zoom:5.5,attributionControl:true});

      mapLoaded=true;
      map.addSource('gpsAccuracy',{type:'geojson',data:noAccuracy});
      map.addLayer({id:'gpsAccuracyFill',type:'fill',source:'gpsAccuracy',paint:{'fill-color':'#68d9af','fill-opacity':0.13}});

    });

function scheduleVisibleMap(){requestAnimationFrame(()=>requestAnimationFrame(initVisibleMap));}
function resizeMap(){if(map&&!$('app').classList.contains('hidden')){map.resize();setTimeout(()=>map?.resize(),200);}}
function centerOnCar(){if(!map||!lastPosition)return;map.easeTo({center:lastPosition,zoom:Math.max(map.getZoom(),16)});}
$('zoomIn').onclick=()=>{if(map)map.zoomIn()};
$('zoomOut').onclick=()=>{if(map)map.zoomOut()};
$('centerCar').onclick=centerOnCar;
$('showTurkey').onclick=()=>{if(map)map.easeTo({center:TURKEY,zoom:5.5});};
$('fullscreenMap').onclick=()=>{
 const full=$('mapPanel').classList.toggle('mapfullscreen');
 document.body.classList.toggle('map-fullscreen',full);
 text('fullscreenMap',full?'⤢ Küçült':'⛶ Tam ekran');
 requestAnimationFrame(()=>requestAnimationFrame(resizeMap));
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('mapPanel').classList.contains('mapfullscreen'))$('fullscreenMap').click()});
const setStatus=(msg,type='')=>{text('message',msg);$('message').className='status '+type;text('gateMessage',msg);$('gateMessage').className='status '+type};
function clearPosition(){lastPosition=null;lastAccuracy=null;$('centerCar').disabled=true;if(marker){marker.remove();marker=null;}updateAccuracy();$('placeholder').classList.remove('hidden');$('mapslink').classList.add('hidden');if(map)map.jumpTo({center:TURKEY,zoom:5.5});text('mapinfo','Geçerli ve güncel GPS konumu bekleniyor.');text('stamp','Henüz sorgulanmadı');text('fields','');text('raw','');}
function stopPolling(){if(pollTimer!==null){clearInterval(pollTimer);pollTimer=null;}}
function stopSessionTimers(){
 if(sessionTimer!==null){clearTimeout(sessionTimer);sessionTimer=null;}
 if(countdownTimer!==null){clearInterval(countdownTimer);countdownTimer=null;}
 sessionEndsAt=0;rapidEndsAt=0;rapidActive=false;
}
function startPolling(){
 stopPolling();
 if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}
 if(rapidActive&&Date.now()>=rapidEndsAt){rapidActive=false;rapidEndsAt=0;}
 if(!loggedIn()||document.hidden)return;
 const interval=rapidActive?FAST_POLL_MS:NORMAL_POLL_MS;
 pollTimer=setInterval(()=>{
  if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}
  if(rapidActive&&Date.now()>=rapidEndsAt){stopRapidMode(false);refreshSessionUI();return;}
  if(loggedIn()&&!document.hidden&&!pending)$('query').click();
 },interval);
}
function refreshSessionUI(){
 if(!loggedIn())return;
 if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}
 const now=Date.now();
 if(rapidActive&&now>=rapidEndsAt){stopRapidMode(false);}
 text('sessionRemain',timeLeft(sessionEndsAt-now));
 const button=$('fastMode');
 if(rapidActive){
  button.disabled=document.hidden;
  button.classList.add('is-fast');
  button.textContent='Hızlı Modu Durdur · '+timeLeft(rapidEndsAt-now);
  button.title='Hızlı modu durdur';
  text('modeStatus','1 sn hızlı izleme');
 }else{
  const cooldown=Math.max(0,readRapidCooldown()-now);
  button.classList.remove('is-fast');
  button.disabled=document.hidden||cooldown>0;
  button.textContent=cooldown>0?'Hızlı Mod Bekleme · '+timeLeft(cooldown):'Hızlı Modu Başlat';
  button.title=cooldown>0?'Hızlı mod beklemede':'istersen abartmayalım';
  text('modeStatus','10 sn normal');
 }
}
function startSessionTimers(){
 stopSessionTimers();
 sessionEndsAt=Date.now()+SESSION_WINDOW_MS;
 sessionTimer=setTimeout(()=>{if(loggedIn())disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');},SESSION_WINDOW_MS);
 countdownTimer=setInterval(refreshSessionUI,1000);
 refreshSessionUI();
}
// Hızlı izleme düğmesi aç/kapat. Otomatik 60 saniye sonunda normal 10 sn moduna döner.
// Tekrar açabilmek için bitişten itibaren 5 dakika bekleme gerekir.
function stopRapidMode(manual){
 if(!rapidActive)return;
 rapidActive=false;rapidEndsAt=0;
 // Erken durdurulursa bekleme süresi gerçek durdurma anından başlar.
 if(manual)saveRapidCooldown(Date.now()+FAST_COOLDOWN_MS);
 startPolling();
}
$('fastMode').onclick=()=>{
 if(!loggedIn())return;
 if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}
 if(document.hidden)return;
 if(rapidActive){stopRapidMode(true);refreshSessionUI();return;}
 const now=Date.now();
 if(readRapidCooldown()>now)return;
 rapidActive=true;rapidEndsAt=now+FAST_WINDOW_MS;
 // Sekme kapansa veya yeniden açılsa da bekleme atlatılamasın.
 saveRapidCooldown(rapidEndsAt+FAST_COOLDOWN_MS);
 startPolling();refreshSessionUI();
 if(!pending)$('query').click();
};
// Sekme gizlendiğinde sorguyu durdur; oturum ve hızlı mod süreleri ilerlemeye devam eder.
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopPolling();refreshSessionUI();return;}
 if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}
 if(loggedIn()){
  if(!pending)$('query').click();
  startPolling();refreshSessionUI();resizeMap();
 }
});
function abortPending(){if(timeout)clearTimeout(timeout);timeout=null;pending=null;$('query').disabled=!client?.connected;}
function disconnect(reason='Bağlantı kapatıldı.'){
 stopPolling();stopSessionTimers();
 if($('mapPanel').classList.contains('mapfullscreen'))$('fullscreenMap').click();
 abortPending();const old=client;client=null;if(old)old.end(true);
 replyTopic=null;$('connect').disabled=false;$('disconnect').disabled=true;$('query').disabled=true;$('fastMode').disabled=true;
 text('state','Bağlı değil');text('sessionRemain','—');text('modeStatus','Normal');$('fastMode').textContent='Hızlı Modu Başlat';$('fastMode').title='istersen abartmayalım';$('fastMode').classList.remove('is-fast');
 $('gate').classList.remove('hidden');$('app').classList.add('hidden');setStatus(reason,reason.includes('doldu')?'bad':'');

}
$('disconnect').onclick=()=>disconnect();$('clear').onclick=clearPosition;
$('pretty').onclick=()=>{$('fields').classList.remove('hidden');$('raw').classList.add('hidden')};$('rawbtn').onclick=()=>{$('fields').classList.add('hidden');$('raw').classList.remove('hidden')};
$('gatePassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('connect').click()});
$('connect').onclick=()=>{
 if(client)disconnect();
 const host=HOST,username=USERNAME,password=$('gatePassword').value,px=PREFIX;
 if(!password){setStatus('Lütfen şifreyi girin.','bad');return;}
 if(!window.mqtt){setStatus('MQTT tarayıcı kitaplığı yüklenemedi.','bad');return;}
 base=px;const id=randomId();replyTopic=`${base}/response`;
 const c=mqtt.connect(`wss://${host}:8084/mqtt`,{clientId:'viewer_'+id,username,password,clean:true,connectTimeout:8000,reconnectPeriod:0,protocolVersion:4});
 client=c;$('connect').disabled=true;setStatus('Şifreli bağlantı kuruluyor...');
 c.on('connect',()=>{if(client!==c)return;c.subscribe(replyTopic,{qos:1},(err,granted)=>{
  if(client!==c)return;
  if(err||!granted?.length||granted.some(x=>x.qos===128)){setStatus('Yanıt topic aboneliği reddedildi. EMQX izinlerini kontrol edin.','bad');c.end(true);return;}
  $('gatePassword').value='';$('gate').classList.add('hidden');$('app').classList.remove('hidden');scheduleVisibleMap();
  $('query').disabled=false;$('disconnect').disabled=false;text('state','WSS bağlı');setStatus('Bağlandı. İlk konum otomatik sorgulanıyor...','good');
  // Başarılı girişten itibaren 5 dakikalık süre başlar.
  startSessionTimers();
  // İlk sorgu hemen, ardından 10 saniyelik normal döngü.
  if(!document.hidden)$('query').click();
  startPolling();
 })});
 c.on('message',(topic,bytes)=>{if(client!==c||topic!==replyTopic||!pending)return;if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}try{if(bytes.length>32768)throw Error('Yanıt fazla büyük');const obj=JSON.parse(bytes.toString());if(!obj||obj.requestId!==pending||typeof obj.data!=='object'||obj.data===null||Array.isArray(obj.data))return;abortPending();showData(obj.data);setStatus('ESP32 yanıtı alındı.','good')}catch(e){setStatus('Geçersiz MQTT yanıtı: '+e.message,'bad')}});

};
$('query').onclick=()=>{if(!client?.connected||pending)return;if(sessionExpired()){disconnect('5 dakikalık izleme süresi doldu. Yeniden şifre girin.');return;}const requestId=randomId();pending=requestId;$('query').disabled=true;setStatus('ESP32 yanıtı bekleniyor...');client.publish(`${base}/request`,JSON.stringify({requestId,action:'home'}),{qos:1,retain:false},err=>{if(err){abortPending();setStatus('Sorgu gönderilemedi.','bad')}});timeout=setTimeout(()=>{if(pending===requestId){abortPending();setStatus('ESP32 yanıt vermedi (12 saniye).','bad')}},12000)};
function showData(d){

 const num=(v,dec=1,unit='')=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('tr-TR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(unit?' '+unit:''):'—';
 const flag=d.fix_ok===true;
 const target=d.route_mode==='ISE'?'İş':d.route_mode==='EVE'?'Ev':null;
 // v4.0.12: Rota 2.0/C3 gibi en kisa MESAFELI gecerli rotayi goster.
 // Sure en kisa mesafenin kendi ETA'sidir; en hizli rota secilmiyor.
 const isRoute=(v,metre,dakika)=>v===true && Number.isFinite(metre) && metre>=0 && Number.isFinite(dakika) && dakika>=0;
 const valid1=isRoute(d.route_valid,d.route_distance_m,d.route_eta_min);
 const valid2=isRoute(d.route2_valid,d.route2_distance_m,d.route2_eta_min);
 const use2=valid2 && (!valid1 || d.route2_distance_m<d.route_distance_m);

 const selectedDistance=routeReady?(use2?d.route2_distance_m:d.route_distance_m):null;
 const selectedEta=routeReady?(use2?d.route2_eta_min:d.route_eta_min):null;
 const makeHead=(label,parent)=>{const h=document.createElement('div');h.className='sectionhead';h.textContent=label;parent.append(h)};
 const makeGrid=(parent,cls)=>{const g=document.createElement('div');g.className=cls;parent.append(g);return g};
 const makeItem=(grid,label,value)=>{
   const el=document.createElement('div');el.className='item';
   const small=document.createElement('small'),bold=document.createElement('b');
   small.textContent=label;bold.textContent=String(value);if(String(value).startsWith('—'))bold.classList.add('value-missing');
   el.append(small,bold);grid.append(el);
 };
 const vehicle=document.createElement('section');vehicle.className='info-section vehicle-section';box.append(vehicle);
 makeHead('Araç ve Rota',vehicle);
 const cards=makeGrid(vehicle,'grid');
 makeItem(cards,'GPS Durumu',flag?'GPS Aktif':'GPS Yok');
 makeItem(cards,'Hız',num(d.speed,1,'km/sa'));
 makeItem(cards,'Hedef',target||'—');
 makeItem(cards,target==='İş'?'İşe Mesafe':target==='Ev'?'Eve Mesafe':'Rota Mesafesi',routeReady?num(selectedDistance/1000,1,'km'):'—');
 makeItem(cards,target==='İş'?'İşe Süre':target==='Ev'?'Eve Süre':'Rota Süresi',routeReady?num(selectedEta,0,'dk'):'—');
 makeItem(cards,'Rakım',num(d.altitude,1,'m'));
 makeItem(cards,'Ölçüm Yaşı',num(typeof d.age_ms==='number'?d.age_ms/1000:null,1,'sn'));
 makeItem(cards,'Son Sorgulama',new Date().toLocaleTimeString('tr-TR'));
 const sat=document.createElement('section');sat.className='info-section sat-section';box.append(sat);
 makeHead('Uydu Bilgileri',sat);
 const sg=makeGrid(sat,'satgrid');
 makeItem(sg,'Kullanılan Uydu',num(d.sats_used,0,'adet'));
 makeItem(sg,'Yatay Doğruluk',num(d.hacc,1,'m'));
 makeItem(sg,'Dikey Doğruluk',num(d.vacc,1,'m'));
 const motor=document.createElement('section');motor.className='info-section motor-section';box.append(motor);
 makeHead('Araç ve Motor',motor);
 const mg=makeGrid(motor,'grid');
 makeItem(mg,'Motor Devri','— RPM');
 makeItem(mg,'Yakıt Seviyesi','— %');
 makeItem(mg,'Su Sıcaklığı','— °C');
 makeItem(mg,'Motor Yükü','— %');
 makeItem(mg,'Akü Gerilimi','— V');
 makeItem(mg,'Anlık Tüketim','— L/100 km');
 text('raw',JSON.stringify(d,null,2));
 text('stamp','• Son yanıt '+new Date().toLocaleTimeString('tr-TR'));
 const lat=d.lat,lon=d.lon,age=d.age_ms;
 const valid=d.fix_ok===true&&d.fresh===true&&typeof lat==='number'&&typeof lon==='number'&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180&&!(lat===0&&lon===0)&&typeof age==='number'&&age<3500;
 text('mapinfo',(valid?'GPS':'GPS YOK')+(typeof age==='number'?' • Ölçüm yaşı '+age+' ms':''));
 if(!valid){lastPosition=null;lastAccuracy=null;$('centerCar').disabled=true;if(marker){marker.remove();marker=null;}updateAccuracy();$('mapslink').classList.add('hidden');$('placeholder').classList.remove('hidden');return;}
 lastPosition=[lon,lat];lastAccuracy=typeof d.hacc==='number'&&d.hacc>0&&d.hacc<5000?d.hacc:null;
 $('centerCar').disabled=false;
 if(!map)initVisibleMap();
 $('placeholder').classList.add('hidden');
 if(marker)marker.remove();
 marker=new maplibregl.Marker({color:'#12b981'}).setLngLat(lastPosition).setPopup(new maplibregl.Popup().setText('GPS • '+lat.toFixed(6)+', '+lon.toFixed(6))).addTo(map);
 updateAccuracy();map.easeTo({center:lastPosition,zoom:Math.max(map.getZoom(),15)});resizeMap();
 $('mapslink').href='https://www.google.com/maps?q='+encodeURIComponent(lat+','+lon);
 $('mapslink').classList.remove('hidden');
}
window.addEventListener('resize',resizeMap);
window.addEventListener('pagehide',()=>{stopPolling();stopSessionTimers();if(client)client.end(true);client=null;abortPending();clearPosition()});
</script></body></html>
